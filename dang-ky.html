<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo tài khoản — PY POS</title>
<meta name="description" content="Tạo tài khoản PY POS cho quán bằng số điện thoại, rồi tải app và đăng nhập trên Android, iPhone, iPad, máy tính Windows hoặc Mac.">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232E7D32'/><path fill='%23fff' fill-rule='evenodd' d='M12,25.4 H33.23 A14.53,14.53 0 0 1 33.23,54.46 H22.06 V74.58 H12 Z M22.06,33.22 H33.23 A6.71,6.71 0 0 1 33.23,46.63 H22.06 Z M52.23,25.4 H63.41 L70.11,39.93 L76.82,25.4 H87.99 L75.7,52.22 V74.58 H64.52 V52.22 Z'/></svg>">
<!--
  Vì sao có trang này: bản iOS KHÔNG được tạo tài khoản trong app.

  Apple từ chối bản 1.0 (2) ngày 08/10/2026 theo Guideline 3.1.1 — app cho
  doanh nghiệp tự đăng ký tài khoản bị coi là cửa bán quyền dùng ở ngoài
  In-App Purchase. Nên trên iPhone/iPad quán tạo tài khoản ở ĐÂY rồi mới
  đăng nhập app. Và cũng vì luật đó, app iOS không được có link nào trỏ về
  trang này: đường tới đây phải đi qua Zalo, Facebook, tờ hướng dẫn...

  Trang này đi ĐÚNG luồng đăng ký của app (luật 0.9m): hỏi Edge Function
  `xac-thuc-sdt` số này đăng ký được không → Firebase gửi mã SMS → người
  dùng nhập mã → gửi giấy chứng nhận (ID token) của Firebase lên function
  → function tạo tài khoản Supabase đứng tên địa chỉ nội bộ sinh từ số điện
  thoại. Server chưa bật xác nhận số (trả `chua_co_sms`) thì rơi về đường
  cũ: gọi thẳng `signUp` như app. Đổi luật ở bên kia (định dạng số, độ dài
  mật khẩu, tên miền nội bộ) thì PHẢI sửa cả ở đây, không thì tài khoản
  tạo trên web không đăng nhập được app.

  KHÔNG nhắc tới gói, giá hay "dùng thử" ở trang này: đó chính là thứ làm
  Apple kết luận tài khoản là thứ được bán.
-->
<style>
  :root {
    --green: #2E7D32; --green-dark: #1B5E20; --green-soft: #E8F1E4;
    --bg: #F7FAF3; --surface: #FFFFFF; --line: #C1CFBA;
    --text: #1A1C19; --muted: #5A6157; --error: #B3261E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }
  a { color: var(--green-dark); }
  .top { background: var(--green-dark); color: #fff; padding: 24px 0 20px; }
  .top .wrap { display: flex; align-items: center; gap: 12px; }
  .top svg { width: 34px; height: 34px; flex: none; }
  .top b { font-size: 18px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 30px 0 8px; letter-spacing: -.4px; }
  .phu { color: var(--muted); margin: 0 0 22px; }
  form, .xong {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px 20px;
  }
  label { display: block; font-weight: 600; margin: 0 0 6px; }
  .o { margin-bottom: 18px; }
  input {
    width: 100%; font: inherit; padding: 13px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text);
  }
  input:focus { outline: 2px solid var(--green); outline-offset: 1px; border-color: var(--green); }
  input[aria-invalid="true"] { border-color: var(--error); }
  .loi { color: var(--error); font-size: 15px; margin: 6px 0 0; min-height: 0; }
  .loi:empty { display: none; }
  button {
    width: 100%; font: inherit; font-weight: 600; padding: 14px;
    border: 0; border-radius: 12px; background: var(--green); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .thongbao { color: var(--error); margin: 14px 0 0; }
  .thongbao:empty { display: none; }
  .so { font-weight: 700; }
  .tai { display: grid; gap: 10px; margin: 14px 0 6px; }
  .nut-tai {
    display: flex; flex-direction: column; text-decoration: none;
    padding: 12px 16px; border-radius: 12px; background: var(--green); color: #fff;
  }
  .nut-tai b { font-size: 17px; }
  .nut-tai span { font-size: 14px; opacity: .9; }
  .nut-tai.sap-co { background: var(--green-soft); color: var(--muted); }
  @media (min-width: 480px) { .tai { grid-template-columns: 1fr 1fr; } }
  main { padding-bottom: 40px; }

  /* Thanh hai bước. Người mở trang này thường nghĩ "đăng ký xong là dùng
     được", trong khi còn một bước nữa là cài app — nói trước từ đầu để họ
     không đóng trang ngay sau khi tạo tài khoản. */
  .buoc { list-style: none; display: flex; gap: 8px; padding: 0; margin: 26px 0 22px; counter-reset: b; }
  .buoc li {
    flex: 1; display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted);
    padding-top: 10px; border-top: 4px solid var(--line);
  }
  .buoc li::before {
    counter-increment: b; content: counter(b);
    flex: none; width: 26px; height: 26px; border-radius: 13px; display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
    background: var(--line); color: var(--text);
  }
  .buoc li[aria-current="step"] { color: var(--text); font-weight: 600; border-top-color: var(--green); }
  .buoc li[aria-current="step"]::before { background: var(--green); color: #fff; }
  .buoc li.da-xong { border-top-color: var(--green); }
  .buoc li.da-xong::before { content: "✓"; background: var(--green-soft); color: var(--green-dark); }
  [hidden] { display: none !important; }
  /* Tiêu đề chỉ cho trình đọc màn hình và máy tìm kiếm — trên màn hình thì
     thanh hai bước đã nói đủ. */
  .an { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#fff"/><path fill="#1B5E20" fill-rule="evenodd" d="M12,25.4 H33.23 A14.53,14.53 0 0 1 33.23,54.46 H22.06 V74.58 H12 Z M22.06,33.22 H33.23 A6.71,6.71 0 0 1 33.23,46.63 H22.06 Z M52.23,25.4 H63.41 L70.11,39.93 L76.82,25.4 H87.99 L75.7,52.22 V74.58 H64.52 V52.22 Z"/></svg>
  <b>PY POS</b>
</div></div>

<main class="wrap">
  <ol class="buoc" aria-label="Các bước">
    <li id="b1" aria-current="step">Tạo tài khoản</li>
    <li id="b2">Tải app và đăng nhập</li>
  </ol>
  <!-- Không tiêu đề, không câu dẫn: tên hai bước ở thanh trên đã nói đủ
       đang làm gì và còn gì phía sau — thêm chữ ở đây là nói lại lần hai. -->
  <h1 class="an">Tạo tài khoản PY POS</h1>

  <form id="form" novalidate>
    <div class="o">
      <label for="sdt">Số điện thoại</label>
      <input id="sdt" type="tel" inputmode="tel" autocomplete="tel">
      <p class="loi" id="loi-sdt"></p>
    </div>
    <div class="o">
      <label for="mk">Mật khẩu</label>
      <input id="mk" type="password" autocomplete="new-password">
      <p class="loi" id="loi-mk"></p>
    </div>
    <div class="o">
      <label for="mk2">Nhập lại mật khẩu</label>
      <input id="mk2" type="password" autocomplete="new-password">
      <p class="loi" id="loi-mk2"></p>
    </div>
    <button id="nut" type="submit">Tạo tài khoản</button>
    <p class="thongbao" id="thongbao" role="alert"></p>
  </form>

  <!-- Bước 2: nhập mã Firebase gửi tới số vừa gõ. -->
  <form id="form-ma" novalidate hidden>
    <p>Đã gửi mã 6 số tới <span class="so" id="so-gui"></span>.</p>
    <div class="o">
      <label for="ma">Mã xác nhận</label>
      <input id="ma" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
      <p class="loi" id="loi-ma"></p>
    </div>
    <button id="nut-ma" type="submit">Xác nhận và tạo tài khoản</button>
    <p class="thongbao" id="thongbao-ma" role="alert"></p>
    <p class="phu" style="margin:14px 0 0"><a href="#" id="gui-lai">Gửi lại mã</a> · <a href="#" id="doi-so">Đổi số khác</a></p>
  </form>
  <!-- Firebase gắn reCAPTCHA vô hình vào đây; thường không hiện gì. -->
  <div id="recaptcha"></div>

  <div class="xong" id="xong" hidden>
    <div class="tai">
      <a class="nut-tai" href="https://play.google.com/store/apps/details?id=com.pysoft.pypos">
        <b>Google Play</b><span>Điện thoại, máy POS Android</span>
      </a>
      <a class="nut-tai" id="tai-ios" href="#" hidden>
        <b>App Store</b><span>iPhone, iPad</span>
      </a>
      <div class="nut-tai sap-co" id="ios-sap-co">
        <b>App Store</b><span>iPhone, iPad — sắp có</span>
      </div>
      <a class="nut-tai" href="https://get.microsoft.com/installer/download/9NCLMSXLQ6HQ?referrer=appbadge&amp;mode=direct">
        <b>Microsoft Store</b><span>Máy tính Windows</span>
      </a>
      <a class="nut-tai" id="tai-mac" href="#" hidden>
        <b>App Store cho Mac</b><span>Mac chip Apple (M1 trở lên)</span>
      </a>
    </div>
  </div>
</main>

<!--
  supabase-js KHÓA CỨNG phiên bản + SRI (08/10/2026). Trước đó nạp
  `@supabase/supabase-js@2/+esm` — phiên bản trôi theo bản mới nhất, và CDN
  bị chiếm là trang chạy mã lạ ngay trong phiên đăng nhập. Giờ trình duyệt
  so mã băm: file trên CDN bị thay một byte là KHÔNG chạy (trang hỏng, chứ
  không chạy mã lạ).

  Nâng phiên bản: đổi số trong URL rồi tính lại mã băm:
    curl -s <URL> | openssl dgst -sha384 -binary | openssl base64 -A
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"
        integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R"
        crossorigin="anonymous"></script>
<!--
  Firebase JS (chỉ để gửi và kiểm mã SMS) — khóa cứng phiên bản + SRI, cùng
  lý do với supabase-js ở trên. Bản "compat" vì là file <script> thường:
  SRI không áp được cho các `import` bên trong một module.
-->
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-app-compat.js"
        integrity="sha384-NGw427w9kUd0u0OjHkygdwNKinWp4DiQMkOsafkwq98j2+E3EN8pn0oSlx3Fe61F"
        crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/12.4.0/firebase-auth-compat.js"
        integrity="sha384-P44Lc4FFaOc/XnFQzAIpmmZZpAstRvYwQLiHHU5LHtlBmblzk5gCbsRCe4hJY6IN"
        crossorigin="anonymous"></script>
<script type="module">
// Nạp bằng thẻ <script> có SRI ở trên — xem chú thích ở đó.
const { createClient } = window.supabase;

// Khóa này công khai được — nó nằm sẵn trong mọi bản app khách cài về, kể
// cả bản web ở nhahang.pypos.vn. An toàn nằm ở RLS
// phía server: tài khoản mới chỉ thấy đúng quán rỗng của chính nó.
const SUPABASE_URL = 'https://vukseslzkxssihcmymcz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1a3Nlc2x6a3hzc2loY215bWN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NzY0MzUsImV4cCI6MjEwNTA1MjQzNX0.CsZWfJ3zH1T15e1ufuoeUbSfu5UIJl3tT8DpKZSOLSQ';

// KHÔNG giữ phiên trong trình duyệt: trang này chỉ để tạo tài khoản, người
// ta không dùng gì trên web cả. Giữ phiên là để lại một tài khoản đăng
// nhập sẵn trên máy tính của ai đó — có khi là máy ở tiệm in.
const db = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false, autoRefreshToken: false },
});

// Link App Store của bản iOS. Để TRỐNG chừng nào Apple chưa duyệt: trang
// hiện "sắp có" thay vì một nút dẫn tới trang không tồn tại. Duyệt xong thì
// dán link (https://apps.apple.com/vn/app/...) vào đây là nút tự hiện.
const LINK_APP_STORE = 'https://apps.apple.com/vn/app/py-pos-nh%C3%A0-h%C3%A0ng/id6820343854';
if (LINK_APP_STORE) {
  const a = document.getElementById('tai-ios');
  a.href = LINK_APP_STORE;
  a.hidden = false;
  document.getElementById('ios-sap-co').hidden = true;
  // Mac chip Apple cài đúng bản iPad này qua Mac App Store ("Designed for
  // iPad") — cùng một link.
  const mac = document.getElementById('tai-mac');
  mac.href = LINK_APP_STORE;
  mac.hidden = false;
}

// ---- Ba luật dưới đây chép từ app, phải giữ Y HỆT ----
// lib/features/sync/domain/phone_login.dart: normalizeVnPhone,
// kAccountEmailDomain; lib/features/sync/domain/sync_auth.dart:
// minSignUpPasswordLength.
const TEN_MIEN_NOI_BO = 'phone.pypos.invalid';
const MAT_KHAU_TOI_THIEU = 6;

function chuanHoaSo(raw) {
  const digits = raw.replace(/[^0-9]/g, '');
  if (!digits) return null;
  let sub;
  if (digits.startsWith('84')) sub = digits.slice(2);
  else if (digits.startsWith('0')) sub = digits.slice(1);
  else sub = digits;
  if (sub.length < 9 || sub.length > 10) return null;
  if (!/^[2-9]/.test(sub)) return null;
  return '84' + sub;
}
// ------------------------------------------------------

const $ = (id) => document.getElementById(id);

function datLoi(o, chu) {
  $('loi-' + o).textContent = chu || '';
  $(o).setAttribute('aria-invalid', chu ? 'true' : 'false');
}

// Gõ lại vào ô nào thì xóa lỗi của ô đó, như trong app.
for (const o of ['sdt', 'mk', 'mk2']) {
  $(o).addEventListener('input', () => datLoi(o, ''));
}

// Firebase — cấu hình app Web trên Firebase Console, PHẢI khớp
// lib/core/config/firebase_config.dart. Không phải bí mật.
firebase.initializeApp({
  apiKey: 'AIzaSyCeiBYzqVBEggmumKW76Q69RtIfGsBWE50',
  authDomain: 'py-pos-1bce4.firebaseapp.com',
  projectId: 'py-pos-1bce4',
  messagingSenderId: '1091109577306',
  appId: '1:1091109577306:web:c5df07aa4195879001ee63',
});
const fb = firebase.auth();
fb.languageCode = 'vi';
// Phiên Firebase chỉ sống đủ để lấy token rồi bỏ — tài khoản thật ở Supabase.
fb.setPersistence(firebase.auth.Auth.Persistence.NONE);
let recaptcha = null;
let xacNhan = null;     // ConfirmationResult của lần gửi mã gần nhất
let dangKy = null;      // { so, mk } đang chờ nhập mã

// Gọi Edge Function xac-thuc-sdt. Luôn về { ket_qua } (HTTP 200); 404 =
// function chưa deploy → coi như chưa có SMS, đi đường cũ.
async function goiServer(than) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/xac-thuc-sdt`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify(than),
  });
  if (res.status === 404) return { ket_qua: 'chua_co_sms' };
  return res.json();
}

// Đổi lỗi Firebase thành câu tiếng Việt — cùng bộ câu với docLoiFirebase
// trong lib/features/sync/domain/otp.dart.
function cauLoiFirebase(code) {
  switch (code) {
    case 'auth/invalid-verification-code': return ['ma', 'Mã chưa đúng'];
    case 'auth/code-expired':
    case 'auth/session-expired': return ['ma', 'Mã đã hết hạn — bấm "Gửi lại mã"'];
    case 'auth/invalid-phone-number': return ['sdt', 'Số điện thoại chưa đúng, ví dụ 0901234567'];
    case 'auth/too-many-requests':
    case 'auth/quota-exceeded': return [null, 'Thử quá nhiều lần. Chờ khoảng một giờ rồi làm lại.'];
    case 'auth/network-request-failed': return [null, 'Không kết nối được — kiểm tra mạng rồi thử lại.'];
    default: return [null, `Chưa gửi được mã xác nhận (${code}).`];
  }
}

// Sang bước 2 sau khi vừa tạo xong tài khoản. Không nhắc lại số vừa tạo:
// dấu ✓ ở bước 1 đã nói tạo xong rồi.
function sangBuoc2() {
  $('form').hidden = true;
  $('form-ma').hidden = true;
  $('xong').hidden = false;
  $('b1').removeAttribute('aria-current');
  $('b1').classList.add('da-xong');
  $('b2').setAttribute('aria-current', 'step');
  window.scrollTo({ top: 0 });
}

function hienXong(so) {
  sangBuoc2(so);
}

async function guiMa(so) {
  if (!recaptcha) {
    recaptcha = new firebase.auth.RecaptchaVerifier('recaptcha', { size: 'invisible' });
  }
  xacNhan = await fb.signInWithPhoneNumber('+' + so, recaptcha);
}

// Đường cũ, khi server chưa bật xác nhận số: gọi thẳng signUp như app.
async function dangKyKhongXacNhan(so, mk) {
  const { data, error } = await db.auth.signUp({ email: `${so}@${TEN_MIEN_NOI_BO}`, password: mk });
  // Dự án đang tắt xác nhận email nên đăng ký là có phiên luôn. Ai bật
  // lại thiết lập đó thì `session` về null và tài khoản CHƯA dùng được —
  // phải nói thật, đừng báo "đã tạo" rồi để người ta đăng nhập app không
  // vào (cùng cách app xử lý, xem signUpNeedsEmailConfirm).
  if (!error && !data.session) {
    $('thongbao').textContent = 'Tài khoản chưa dùng được ngay. Nhắn Zalo 0934 773 909 để được kích hoạt.';
    return;
  }
  if (error) {
    const code = error.code || '';
    const msg = (error.message || '').toLowerCase();
    if (code === 'user_already_exists' || code === 'email_exists' ||
        msg.includes('already registered') || msg.includes('already exists')) {
      datLoi('sdt', 'Số này đã có tài khoản — mở app và đăng nhập bằng số này');
    } else if (code === 'weak_password') {
      datLoi('mk', 'Mật khẩu quá yếu — thêm chữ và số');
    } else if (error.status === 429 || code === 'over_email_send_rate_limit') {
      $('thongbao').textContent = 'Đang bị chặn vì thử quá nhiều lần. Chờ vài phút rồi làm lại.';
    } else {
      $('thongbao').textContent = 'Chưa tạo được tài khoản. Thử lại sau ít phút.';
    }
    return;
  }
  await db.auth.signOut();
  hienXong(so);
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('thongbao').textContent = '';

  const sdt = $('sdt').value.trim();
  const mk = $('mk').value;
  const mk2 = $('mk2').value;
  const so = chuanHoaSo(sdt);

  const loiSdt = !sdt ? 'Nhập số điện thoại'
    : !so ? 'Số điện thoại chưa đúng, ví dụ 0901234567' : '';
  const loiMk = !mk ? 'Nhập mật khẩu'
    : mk.length < MAT_KHAU_TOI_THIEU ? `Mật khẩu cần ít nhất ${MAT_KHAU_TOI_THIEU} ký tự` : '';
  const loiMk2 = !mk2 ? 'Nhập lại mật khẩu'
    : mk2 !== mk ? 'Hai mật khẩu chưa giống nhau' : '';
  datLoi('sdt', loiSdt); datLoi('mk', loiMk); datLoi('mk2', loiMk2);
  if (loiSdt || loiMk || loiMk2) return;

  $('nut').disabled = true;
  // "Đang tạo tài khoản" chứ không "Đang gửi mã": đúng cho cả hai đường —
  // xác nhận số đang tắt (server trả `chua_co_sms`) thì đây là lúc tạo tài
  // khoản thật, còn bật thì gửi mã cũng là một phần của việc tạo tài khoản.
  $('nut').textContent = 'Đang tạo tài khoản…';
  try {
    // Hỏi server TRƯỚC khi nhờ Firebase gửi tin: mỗi tin là tiền, và số đã
    // có tài khoản thì gửi mã xong cũng không tạo được.
    const kiem = await goiServer({ hanh_dong: 'kiem_tra', sdt: so, muc_dich: 'dang_ky' });
    if (kiem.ket_qua === 'chua_co_sms') return await dangKyKhongXacNhan(so, mk);
    if (kiem.ket_qua === 'da_co_tai_khoan') {
      return datLoi('sdt', 'Số này đã có tài khoản — mở app và đăng nhập bằng số này');
    }
    if (kiem.ket_qua !== 'hop_le') {
      $('thongbao').textContent = `Server đang lỗi, thử lại sau ít phút (${kiem.ket_qua || 'khong_ro'}).`;
      return;
    }

    await guiMa(so);
    dangKy = { so, mk };
    $('so-gui').textContent = '0' + so.slice(2);
    $('form').hidden = true;
    $('form-ma').hidden = false;
    $('ma').focus();
  } catch (err) {
    const [o, chu] = err && err.code ? cauLoiFirebase(err.code) : [null, 'Không kết nối được — kiểm tra mạng rồi thử lại.'];
    if (o === 'sdt') datLoi('sdt', chu); else $('thongbao').textContent = chu;
  } finally {
    $('nut').disabled = false;
    $('nut').textContent = 'Tạo tài khoản';
  }
});

$('ma').addEventListener('input', () => datLoi('ma', ''));

$('form-ma').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('thongbao-ma').textContent = '';
  const ma = $('ma').value.trim();
  if (!/^\d{6}$/.test(ma)) return datLoi('ma', ma ? 'Mã gồm 6 chữ số' : 'Nhập mã trong tin nhắn');

  $('nut-ma').disabled = true;
  $('nut-ma').textContent = 'Đang xác nhận…';
  try {
    const kq = await xacNhan.confirm(ma);
    const token = await kq.user.getIdToken();
    await fb.signOut();
    const tra = await goiServer({
      hanh_dong: 'xac_nhan_firebase', sdt: dangKy.so, muc_dich: 'dang_ky',
      firebase_token: token, mat_khau: dangKy.mk,
    });
    if (tra.ket_qua === 'xong') return hienXong(dangKy.so);
    $('thongbao-ma').textContent = {
      da_co_tai_khoan: 'Số này vừa có tài khoản — mở app và đăng nhập bằng số này.',
      ma_het_han: 'Mã đã hết hạn — bấm "Gửi lại mã".',
      firebase_sai: 'Không xác nhận được số này. Bấm "Gửi lại mã" rồi thử lại.',
      mat_khau_yeu: 'Mật khẩu cần ít nhất 6 ký tự — bấm "Đổi số khác" để nhập lại.',
    }[tra.ket_qua] || `Server đang lỗi, thử lại sau ít phút (${tra.ket_qua || 'khong_ro'}).`;
  } catch (err) {
    const [o, chu] = err && err.code ? cauLoiFirebase(err.code) : [null, 'Không kết nối được — kiểm tra mạng rồi thử lại.'];
    if (o === 'ma') datLoi('ma', chu); else $('thongbao-ma').textContent = chu;
  } finally {
    $('nut-ma').disabled = false;
    $('nut-ma').textContent = 'Xác nhận và tạo tài khoản';
  }
});

$('gui-lai').addEventListener('click', async (e) => {
  e.preventDefault();
  $('thongbao-ma').textContent = '';
  try {
    await guiMa(dangKy.so);
    $('ma').value = '';
    $('thongbao-ma').textContent = 'Đã gửi mã mới.';
  } catch (err) {
    $('thongbao-ma').textContent = cauLoiFirebase(err && err.code)[1];
  }
});

$('doi-so').addEventListener('click', (e) => {
  e.preventDefault();
  $('form-ma').hidden = true;
  $('form').hidden = false;
});
</script>
</body>
</html>
